services:
  db:
    image: postgres:16
    container_name: milk-world-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-milk_world}
      POSTGRES_USER: ${POSTGRES_USER:-milk_world}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_local}
    ports:
      - "5432:5432"
    volumes:
      - milk_world_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-milk_world} -d ${POSTGRES_DB:-milk_world}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  milk_world_postgres_data:
