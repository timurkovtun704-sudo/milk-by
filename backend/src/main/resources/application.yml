server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: milk-world-backend
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:milk_world}
    username: ${DB_USERNAME:milk_world}
    password: ${DB_PASSWORD:change_me_local}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  # Flyway migrations will be configured when the database schema is added.
